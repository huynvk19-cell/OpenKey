name: Auto switch build

on:
  push:
    branches: [ "master", "auto-switch", "claude/optimistic-hypatia-dlfzkp" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: AutoSwitch sources are ASCII (MSVC reads them as ANSI)
      run: "! grep -nP '[^\\x00-\\x7F]' Sources/OpenKey/engine/AutoSwitch.h Sources/OpenKey/engine/AutoSwitch.cpp"

    - name: AutoSwitch unit tests
      run: |
        g++ -std=c++17 -O1 -Wall -I Sources/OpenKey/engine tests/autoswitch_test.cpp Sources/OpenKey/engine/AutoSwitch.cpp -o autoswitch_test
        ./autoswitch_test

  build:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 .\Sources\OpenKey\win32\OpenKey\OpenKey.sln

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: NhaKey64
        path: Sources/OpenKey/win32/OpenKey/**/NhaKey64.exe

    - name: Publish download link
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/auto-switch' || github.ref == 'refs/heads/claude/optimistic-hypatia-dlfzkp')
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        EXE=$(find Sources/OpenKey/win32/OpenKey -name NhaKey64.exe -path '*Release*' | head -1)
        cp "$EXE" NhaKey64.exe
        gh release delete auto-switch-latest --yes --cleanup-tag || true
        gh release create auto-switch-latest NhaKey64.exe \
          --title "NhaKey (latest)" \
          --notes "Automatic QWERTY/Dvorak layout and English/Vietnamese switching, paused in Moonlight / UltraViewer. Built from ${GITHUB_SHA}."
